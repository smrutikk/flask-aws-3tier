<!DOCTYPE html>
<html>
<head>
    <title>Flask AWS 3-Tier App</title>
 <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f2f4f8;
        }
        h2 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"], input[type="email"] {
            padding: 8px;
            margin-right: 10px;
        }
        button {
            padding: 8px 14px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 5px;
        }
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #eee;
        }
    </style>
</head>
<body>
    <h2>User List</h2>

    <form action="/add" method="POST">
        <input type="text" name="name" placeholder="Enter name" required>
        <input type="email" name="email" placeholder="Enter email" required>
        <button type="submit">Add User</button>
    </form> 

    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Action</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td><a href="/delete/{{ user.id }}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
